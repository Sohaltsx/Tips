# Minimal Supabase CLI config for this project.
# Every function is called by something that does NOT have a Supabase JWT
# (the public tip page, the Cashfree / Razorpay webhooks, the keep-alive ping), so JWT
# verification is turned off. Each function does its own checks instead
# (CORS + validation + rate limit, HMAC signature, read-only health query).

project_id = "pqvygvligzexbeloakkn"

[functions.create-order]
verify_jwt = false

[functions.razorpay-webhook]
verify_jwt = false

[functions.verify-payment]
verify_jwt = false

[functions.health]
verify_jwt = false

[functions.cashfree-webhook]
verify_jwt = false

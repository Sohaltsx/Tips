<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tip Sohal Gaming</title>
  <meta name="description" content="Support Sohal Gaming live streams. Your tip and message show up on stream.">
  <meta name="theme-color" content="#111111">
  <meta property="og:title" content="Tip Sohal Gaming">
  <meta property="og:description" content="Send a tip and get your message on the live stream.">
  <meta property="og:image" content="assets/logo.webp">
  <link rel="icon" href="assets/logo.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="wrap">
    <header class="brand">
      <img class="avatar" src="assets/logo.webp" alt="Sohal Gaming" width="112" height="112">
      <h1>Sohal <span>Gaming</span></h1>
      <p>Support the stream &amp; get your message on screen</p>
      <div class="live-pill"><i></i> Shows live on stream</div>
    </header>

    <form class="card" id="tip-form" novalidate>
      <div class="error" id="error" role="alert"></div>

      <div class="field">
        <label for="name">Your name <small id="name-count">0/30</small></label>
        <input id="name" name="name" type="text" maxlength="30" autocomplete="nickname"
               placeholder="Shown on stream" required>
      </div>

      <div class="field">
        <div class="label" id="amount-label">Amount</div>
        <div class="quick" id="quick" role="group" aria-labelledby="amount-label"></div>
        <div class="amount-input">
          <span>₹</span>
          <label for="amount" class="sr-only">Amount in rupees</label>
          <input id="amount" name="amount" type="number" inputmode="numeric" step="1"
                 placeholder="Custom amount" required>
        </div>
        <p class="hint" id="amount-hint"></p>
        <p class="hint tts" id="tts-hint">🔊 <span></span></p>
      </div>

      <div class="field">
        <label for="message">Message <small><span id="msg-count">0</span>/200 · optional</small></label>
        <textarea id="message" name="message" maxlength="200" rows="3"
                  placeholder="Say something to the stream…"></textarea>
      </div>

      <button class="btn" id="tip-btn" type="submit">
        <span class="spinner" aria-hidden="true"></span>
        <span id="tip-btn-text">Tip</span>
      </button>
      <p class="secure">🔒 Secure payment by Razorpay · UPI · Cards · Netbanking · Wallets</p>
    </form>
  </main>

  <footer>
    <nav>
      <a href="terms.html">Terms</a>
      <a href="privacy.html">Privacy</a>
      <a href="refunds.html">Refunds</a>
      <a href="contact.html">Contact</a>
    </nav>
    © <span id="year"></span> Sohal Gaming
  </footer>

  <script src="assets/config.js"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
  <script src="assets/app.js" defer></script>
</body>
</html>

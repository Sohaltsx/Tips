name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish only the static site — not supabase/, scripts/ or tests.
      - name: Build site folder
        run: |
          mkdir _site
          cp *.html _site/
          cp -r assets _site/
          touch _site/.nojekyll

      - name: Refuse to deploy secrets
        run: |
          # Key IDs (rzp_test_/rzp_live_) are public; block things that look like real secrets.
          if grep -rIE "service_role|eyJhbGciOi|RAZORPAY_KEY_SECRET|RAZORPAY_WEBHOOK_SECRET|STREAMLABS_ACCESS_TOKEN|key_secret" _site; then
            echo "Possible secret in site files — aborting." && exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

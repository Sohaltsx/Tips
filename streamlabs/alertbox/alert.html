<!-- Sohal Gaming — Streamlabs Alert Box custom HTML (Tips).
     Paste into: Alert Box → Tips → Custom HTML/CSS → HTML tab.
     Streamlabs replaces {name}, {amount} and {message} (HTML-escaped) before each alert. -->
<div class="sg-alert" id="sg-alert">
  <div class="sg-sweep"></div>

  <div class="sg-body">
    <div class="sg-label"><i></i><span id="sg-label-text">New tip</span></div>
    <div class="sg-line">
      <span class="sg-name" id="sg-name">{name}</span>
      <span class="sg-amount" id="sg-amount">{amount}</span>
    </div>
    <div class="sg-message" id="sg-message">{message}</div>
  </div>
</div>

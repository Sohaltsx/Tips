<!-- Sohal Gaming — Streamlabs Alert Box custom HTML (YouTube → Subscribers).
     Paste into: Alert Box → YouTube → Subscribers → Custom HTML/CSS → HTML tab.
     CSS tab: the same alert.css as Tips. Streamlabs replaces {name} (HTML-escaped). -->
<div class="sg-alert sg-sub" id="sg-alert">
  <div class="sg-sweep"></div>

  <div class="sg-body">
    <div class="sg-label"><i></i><span>New subscriber</span></div>
    <div class="sg-line">
      <span class="sg-name" id="sg-name">{name}</span>
      <span class="sg-subbtn" id="sg-subbtn">
        <span class="sg-subbtn-a">Subscribe</span>
        <span class="sg-subbtn-b">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2z"/></svg>
          Subscribed
        </span>
      </span>
    </div>
    <div class="sg-message">Welcome to the Sohal Gaming squad!</div>
  </div>
</div>

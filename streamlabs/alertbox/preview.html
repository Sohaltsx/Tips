<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alert Preview</title>
  <style>
    body { margin: 0; font: 14px system-ui, sans-serif; color: #fff; background: #0b0b0b; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; padding: 12px 16px; background: #1a1a1a; border-bottom: 1px solid #343434; }
    .controls label { display: grid; gap: 4px; font-size: 12px; color: #aaa; }
    .controls input { padding: 6px 8px; background: #111; color: #fff; border: 1px solid #343434; border-radius: 6px; }
    .controls button { padding: 8px 14px; border: 0; border-radius: 6px; background: #f20d24; color: #fff; font-weight: 600; cursor: pointer; }
    .controls button.alt { background: #343434; }
    /* Fake stream background so the transparent alert is easy to judge */
    .stage { position: relative; height: 420px; overflow: hidden;
      background: linear-gradient(135deg, #2a3a4a, #5a4a3a 60%, #1f2a1f); }
    .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
  </style>
</head>
<body>
  <div class="controls">
    <label>Name <input id="name" value="Rahul_Kumar"></label>
    <label>Amount (₹) <input id="amount" type="number" value="150" style="width:90px"></label>
    <label style="flex:1;min-width:220px">Message <input id="message" value="GTA 6 stream lets go!! 🔥 Love from Delhi"></label>
    <button id="play">Play alert</button>
    <button class="alt" data-preset="big">Big tip</button>
    <button class="alt" data-preset="nomsg">No message</button>
    <button class="alt" data-preset="long">Long text</button>
  </div>
  <div class="stage"><iframe id="frame" title="Alert"></iframe></div>

  <script>
    // Mimics Streamlabs: replaces {tokens} in the custom HTML/CSS/JS and renders one alert.
    const files = {};
    const load = (f) => fetch(f, { cache: "no-store" }).then((r) => r.text());

    const presets = {
      big: ["Mega_Fan_99", 2500, "Here's for the GTA 6 marathon!"],
      nomsg: ["Ankit", 50, ""],
      long: ["Supercalifragilistic_Gamer", 1234.5, "This is a very long message to check wrapping. ".repeat(6)],
    };

    function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

    function render() {
      const fields = JSON.parse(files.fields);
      const tokens = {};
      for (const [k, f] of Object.entries(fields)) tokens[k] = f.value;
      const name = document.getElementById("name").value;
      const amount = Number(document.getElementById("amount").value || 0);
      tokens.messageTemplate =
        `<span data-token="name">${esc(name)}</span> donated <span data-token="amount">₹${amount.toFixed(2)}</span>!`;
      tokens.userMessage = esc(document.getElementById("message").value);
      tokens.img = "";
      const fill = (s) => s.replace(/\{(\w+)\}/g, (m, k) => (k in tokens ? tokens[k] : m));

      document.getElementById("frame").srcdoc =
        `<!doctype html><html><head><meta charset="utf-8"><style>${fill(files.css)}</style></head>` +
        `<body>${fill(files.html)}<script>${fill(files.js)}<\/script></body></html>`;
    }

    Promise.all(["alert.html", "alert.css", "alert.js", "fields.json"].map(load)).then(([html, css, js, fields]) => {
      Object.assign(files, { html, css, js, fields });
      render();
    });

    document.getElementById("play").onclick = render;
    document.querySelectorAll("[data-preset]").forEach((b) => (b.onclick = () => {
      const [n, a, m] = presets[b.dataset.preset];
      document.getElementById("name").value = n;
      document.getElementById("amount").value = a;
      document.getElementById("message").value = m;
      render();
    }));
  </script>
</body>
</html>
